version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: takehome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  producer:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.producer
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/takehome?sslmode=disable
      CONSUMER_URL: http://consumer:8081
      LOG_FILE: /var/log/takehome/producer.log
    ports:
      - "8080:8080"   # REST API
      - "9100:9100"   # Metrics
      - "6060:6060"   # pprof
    volumes:
      - app_logs:/var/log/takehome

  consumer:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.consumer
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/takehome?sslmode=disable
      PROMETHEUS_PORT: "9101"
      PROFILING_PORT: "6061"
      LOG_FILE: /var/log/takehome/consumer.log
    ports:
      - "8081:8081"   # REST API
      - "9101:9101"   # Metrics
      - "6061:6061"   # pprof
    volumes:
      - app_logs:/var/log/takehome

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - producer
      - consumer

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - app_logs:/var/log/takehome:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  loki_data:
  app_logs:
